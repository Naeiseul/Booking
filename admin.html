<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Owner Dashboard</title>
    <link rel="icon" type="image/svg+xml" href="/logtraq-favicon.svg?v=1">
    <link rel="apple-touch-icon" href="/logo_square.png">
    <script>
        (function() {
            var path = window.location.pathname;
            var parts = path.split('/').filter(Boolean);
            var slug = parts[parts.length - 1] || 'default';
            var link = document.createElement('link');
            link.rel = 'manifest';
            link.href = '/api/manifest?slug=' + encodeURIComponent(slug);
            document.head.appendChild(link);
        })();
    </script>
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/admin.css">
</head>
<body class="admin-page">
    <div class="admin-shell" id="admin-shell">
        <aside class="admin-sidebar" id="admin-sidebar" hidden>
            <p class="admin-sidebar-label">Your business</p>
            <p class="admin-business-name" id="admin-business-name"></p>
            <nav class="admin-navigation" aria-label="Dashboard">
                <a href="#calendar" id="nav-calendar" aria-controls="calendar-panel" aria-current="page">Calendar</a>
                <a href="#services" id="nav-services" aria-controls="services-panel">Services</a>
            </nav>
        </aside>
    <div class="container-owner admin-content">
        <header style="display: flex; flex-direction: column; align-items: center; gap: 16px; margin-bottom: 32px;">
            <!-- Avatar Bubble -->
            <div id="biz-avatar-container" style="width: 88px; height: 88px; border-radius: 50%; background: linear-gradient(135deg, var(--brand-light), #E0F2FE); display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px -5px rgba(15, 118, 110, 0.25); overflow: hidden;">
                <svg id="biz-avatar-svg" xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--brand)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                <img id="biz-avatar-img" src="" alt="Business Logo" style="width: 100%; height: 100%; object-fit: cover; display: none;">
            </div>
            
            <div style="text-align: center; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 8px;">
                <h1 id="biz-title-text" style="color: var(--text); font-weight: 700; font-size: 24px; margin: 0; padding-bottom: 4px; width: 100%;"><span class="skeleton-text" style="display:inline-block;"></span></h1>
                <p class="muted-text" id="business-status" style="margin: 0;"><span class="skeleton-text" style="display:inline-block; height: 14px; width: 120px;"></span></p>
                
                <!-- Social Links -->
                <div id="social-links" style="display: flex; gap: 16px; margin-top: 4px; justify-content: center;">
                    <a id="ig-link" href="#" target="_blank" style="display: none; color: #E1306C; transition: transform 0.2s ease;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
                    </a>
                    <a id="fb-link" href="#" target="_blank" style="display: none; color: #1877F2; transition: transform 0.2s ease;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"></path></svg>
                    </a>
                </div>
            </div>
        </header>

        <main class="admin-main">
            <section id="calendar-panel" aria-labelledby="calendar-heading">
            <h2 class="admin-section-title" id="calendar-heading" tabindex="-1">Calendar</h2>
            <!-- Day selector tabs will be injected here -->
            <div class="day-tab-list" id="day-tabs"></div>

            <div style="display: flex; gap: 16px; justify-content: center; margin-bottom: 24px; font-size: 14px; font-weight: 500; color: var(--muted);">
                <span style="display: flex; align-items: center; gap: 8px;">
                    <span style="display: inline-block; width: 10px; height: 10px; border-radius: 50%; background-color: var(--brand);"></span> Available
                </span>
                <span style="display: flex; align-items: center; gap: 8px;">
                    <span style="display: inline-block; width: 10px; height: 10px; border-radius: 50%; background-color: var(--taken);"></span> Unavailable
                </span>
            </div>

            <!-- Time slot chips will be injected here -->
            <div class="time-chip-grid" id="time-grid">
                <div class="skeleton-chip"></div>
                <div class="skeleton-chip"></div>
                <div class="skeleton-chip"></div>
                <div class="skeleton-chip"></div>
                <div class="skeleton-chip"></div>
                <div class="skeleton-chip"></div>
                <div class="skeleton-chip"></div>
                <div class="skeleton-chip"></div>
            </div>
            <p class="muted-text admin-updated" id="last-updated">Last updated: --</p>
            </section>
            <section id="services-panel" aria-labelledby="services-heading" hidden>
                <div class="admin-section-heading">
                    <h2 class="admin-section-title" id="services-heading" tabindex="-1">Services</h2>
                    <button class="admin-add-service" type="button" disabled aria-describedby="services-coming-soon">Add service</button>
                </div>
                <p class="muted-text admin-section-description">Manage what your business offers.</p>
                <div class="admin-services-empty">
                    <h3>Your service catalogue starts here</h3>
                    <p>Add your first service to start building your catalogue.</p>
                    <p class="muted-text" id="services-coming-soon">Service creation is coming soon.</p>
                </div>
            </section>
        </main>

        <footer style="margin-top: auto; padding-top: 16px; border-top: 1px solid var(--border);">

            <!-- Logtraq Viral Footer -->
            <div style="margin-top: 24px; font-size: 12px; color: #94A3B8; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 500;">
                <div style="display: flex; align-items: center; gap: 6px;">
                    <img src="/final_tax_logo.png" alt="Logtraq" style="width: 14px; height: 14px; border-radius: 50%; object-fit: cover;">
                    <span>© 2026 Logtraq</span>
                </div>
                <span style="opacity: 0.4;">|</span>
                <a href="mailto:info@logtraq.co.za" style="text-decoration: none; font-size: 14px; opacity: 0.8; transition: opacity 0.2s;" title="Email Logtraq">✉️</a>
                <a href="tel:+27793257256" style="text-decoration: none; font-size: 14px; opacity: 0.8; transition: opacity 0.2s;" title="Call Logtraq">📞</a>
            </div>
        </footer>
    </div>

    </div>

    <!-- Load the configuration keys -->
    <script src="/config.js"></script>
    <!-- Load the admin logic -->
    <script src="/admin-navigation.js"></script>
    <script src="/admin.js"></script>
</body>
</html>
