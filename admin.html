<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Owner Dashboard</title>
    <link rel="icon" type="image/png" href="final_tax_logo.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container-owner">
        <header style="display: flex; flex-direction: column; align-items: center; gap: 16px; margin-bottom: 32px;">
            <!-- Avatar Bubble -->
            <div style="width: 88px; height: 88px; border-radius: 50%; background: linear-gradient(135deg, var(--brand-light), #E0F2FE); display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px -5px rgba(15, 118, 110, 0.25);">
                <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--brand)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            </div>
            
            <div style="text-align: center;">
                <h1 id="biz-title-text" style="color: var(--text); font-weight: 700; font-size: 24px; margin: 0; padding-bottom: 4px;">Loading...</h1>
                <p class="muted-text" id="business-status" style="margin: 0;">Verifying access key...</p>
            </div>
        </header>

        <main style="margin-top: 24px;">
            <!-- Day selector tabs will be injected here -->
            <div class="day-tab-list" id="day-tabs"></div>

            <div style="display: flex; gap: 16px; justify-content: center; margin-bottom: 24px; font-size: 14px; font-weight: 500; color: var(--muted);">
                <span style="display: flex; align-items: center; gap: 8px;">
                    <span style="display: inline-block; width: 10px; height: 10px; border-radius: 50%; background-color: var(--brand);"></span> Available
                </span>
                <span style="display: flex; align-items: center; gap: 8px;">
                    <span style="display: inline-block; width: 10px; height: 10px; border-radius: 50%; background-color: var(--taken);"></span> Unavailable
                </span>
            </div>

            <!-- Time slot chips will be injected here -->
            <div class="time-chip-grid" id="time-grid">
                <div class="empty-state">Please wait...</div>
            </div>
        </main>

        <footer style="margin-top: auto; padding-top: 16px; border-top: 1px solid var(--border);">
            <p class="muted-text" style="text-align: center;" id="last-updated">Last updated: --</p>
        </footer>
    </div>

    <!-- Load the configuration keys -->
    <script src="config.js"></script>
    <!-- Load the admin logic -->
    <script src="admin.js"></script>
</body>
</html>
