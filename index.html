<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Booking Availability</title>
    <link rel="icon" type="image/png" href="final_tax_logo.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container-public">
        <header style="display: flex; flex-direction: column; align-items: center; gap: 16px; margin-bottom: 32px;">
            <!-- Avatar Bubble -->
            <div style="width: 88px; height: 88px; border-radius: 50%; background: linear-gradient(135deg, var(--brand-light), #E0F2FE); display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px -5px rgba(15, 118, 110, 0.25);">
                <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--brand)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            </div>
            
            <div style="text-align: center;">
                <h1 id="biz-title-text" style="color: var(--text); font-weight: 700; font-size: 24px; margin: 0; padding-bottom: 4px;">Loading...</h1>
                <p class="muted-text" id="business-status" style="margin: 0;">Fetching availability...</p>
            </div>
        </header>

        <main style="margin-top: 24px;">
            <!-- Day selector tabs will be injected here by JavaScript -->
            <div class="day-tab-list" id="day-tabs"></div>

            <!-- Time slot chips will be injected here by JavaScript -->
            <div class="time-chip-grid" id="time-grid">
                <div class="empty-state">Please wait...</div>
            </div>
        </main>

        <footer style="margin-top: 16px; text-align: center;">
            <div id="whatsapp-btn" style="display: flex; align-items: center; justify-content: center; gap: 10px; background-color: var(--brand); color: #FFF; padding: 18px 24px; border-radius: 100px; font-weight: 600; font-size: 16px; box-shadow: 0 10px 20px -5px rgba(15, 118, 110, 0.4); cursor: pointer; transition: transform 0.2s;">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
                Book via WhatsApp
            </div>
        </footer>
    </div>

    <!-- Load the configuration keys -->
    <script src="config.js"></script>
    <!-- Load the logic -->
    <script src="app.js"></script>
</body>
</html>
