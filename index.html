<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Booking Availability</title>
    <link rel="icon" type="image/svg+xml" href="/logtraq-favicon.svg?v=1">
    <link rel="apple-touch-icon" href="/logo_square.png">
    <script>
        (function() {
            // Try to get slug from the pathname (e.g. /logtraq-boutique)
            var path = window.location.pathname;
            var parts = path.split('/').filter(Boolean);
            var slug = parts[parts.length - 1];
            // If pathname is just '/' or empty, fall back to ?slug= query param
            if (!slug || slug === 'index.html') {
                var urlParams = new URLSearchParams(window.location.search);
                slug = urlParams.get('slug') || urlParams.get('biz') || 'default';
            }
            var link = document.createElement('link');
            link.rel = 'manifest';
            link.href = '/api/manifest?slug=' + encodeURIComponent(slug);
            document.head.appendChild(link);
        })();
    </script>
    <link rel="stylesheet" href="/styles.css?v=3">
    <link rel="stylesheet" href="/catalogue.css?v=15">
    <link rel="stylesheet" href="/profile.css?v=3">
</head>
<body class="catalogue-page">
    <div class="container-public">
        <header class="public-brand-header" style="display: flex; flex-direction: column; align-items: center; gap: 16px; margin-bottom: 32px;">
            <div id="business-cover-banner" class="business-cover-banner" aria-label="Business cover image"></div>
            <!-- Avatar Bubble -->
            <div id="biz-avatar-container" class="public-brand-avatar" style="width: 88px; height: 88px; border-radius: 50%; background: linear-gradient(135deg, var(--brand-light), #E0F2FE); display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px -5px rgba(15, 118, 110, 0.25); overflow: hidden;">
                <svg id="biz-avatar-svg" xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--brand)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                <img id="biz-avatar-img" src="" alt="Business Logo" style="width: 100%; height: 100%; object-fit: contain; display: none;">
            </div>
            
            <div style="text-align: center; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 8px;">
                <h1 id="biz-title-text" style="color: var(--text); font-weight: 700; font-size: 24px; margin: 0; padding-bottom: 4px; width: 100%;"><span class="skeleton-text" style="display:inline-block;"></span></h1>
                <p id="business-tagline" hidden></p>
                <p class="muted-text" id="business-status" style="margin: 0;" hidden></p>
                
                <!-- Social Links -->
                <div id="social-links" style="display: flex; gap: 16px; margin-top: 4px; justify-content: center; align-items: center;">
                    <a id="business-phone-link" aria-label="Call business" style="display: none;">
                        <img src="/phone.png?v=2" width="24" height="24" alt="" aria-hidden="true" style="display: block;">
                    </a>
                    <a id="business-whatsapp-link" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp" title="WhatsApp" style="display: none; width: 44px; height: 44px; align-items: center; justify-content: center;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 32 32" aria-hidden="true" focusable="false" style="display:block; flex-shrink:0;"><path fill="#25D366" d="M16 .8A15.1 15.1 0 0 0 3 23.5L.8 31l7.7-2A15.2 15.2 0 1 0 16 .8Z"/><path fill="#fff" d="M16 3.7a12.2 12.2 0 0 0-10.5 18.4l.6 1-1.3 4.1 4.2-1.1 1 .6A12.2 12.2 0 1 0 16 3.7Zm0 22.1a9.9 9.9 0 0 1-5.1-1.4l-.4-.2-2.5.7.7-2.4-.3-.4A9.9 9.9 0 1 1 16 25.8Z"/><path fill="#fff" d="M11.1 9.8c-.3-.7-.6-.7-.9-.7h-.8c-.3 0-.8.1-1.2.6-.4.5-1.5 1.5-1.5 3.6s1.6 4.2 1.8 4.5c.2.3 3 4.8 7.4 6.5 3.6 1.4 4.4 1.1 5.2 1 .8-.1 2.5-1 2.8-2 .3-1 .3-1.9.2-2.1-.1-.2-.4-.3-.9-.6l-2.7-1.3c-.4-.2-.7-.3-1 .3-.3.5-1.1 1.3-1.4 1.6-.2.3-.5.3-.9.1-.5-.2-1.9-.7-3.6-2.3-1.3-1.2-2.2-2.7-2.5-3.2-.2-.4 0-.7.2-.9l.7-.8.5-.7c.2-.3.1-.6 0-.8l-1.2-2.8Z" transform="translate(2.5 0) scale(.86)"/></svg>
                    </a>
                    <a id="ig-link" href="#" target="_blank" style="display: none; color: #E1306C; transition: transform 0.2s ease;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
                    </a>
                    <a id="tiktok-link" href="#" target="_blank" rel="noopener noreferrer" aria-label="TikTok profile" title="TikTok" style="display: none;">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="80 50 385 445" width="24" height="24" aria-hidden="true" focusable="false">
                            <path fill="#25F4EE" transform="translate(-14 -19)" d="M297 85H352C361 136 394 169 434 177V223C396 226 362 207 337 177V356C337 416 289 459 226 459C163 459 113 412 113 350C113 289 162 240 224 240V278C185 276 151 307 151 345C151 382 181 412 218 412C254 412 282 383 282 346V85Z"/>
                            <path fill="#FE2C55" transform="translate(15 19)" d="M297 85H352C361 136 394 169 434 177V223C396 226 362 207 337 177V356C337 416 289 459 226 459C163 459 113 412 113 350C113 289 162 240 224 240V278C185 276 151 307 151 345C151 382 181 412 218 412C254 412 282 383 282 346V85Z"/>
                            <path fill="#000" d="M297 85H352C361 136 394 169 434 177V223C396 226 362 207 337 177V356C337 416 289 459 226 459C163 459 113 412 113 350C113 289 162 240 224 240V278C185 276 151 307 151 345C151 382 181 412 218 412C254 412 282 383 282 346V85Z"/>
                        </svg>
                    </a>
                    <a id="fb-link" href="#" target="_blank" style="display: none; color: #1877F2; transition: transform 0.2s ease;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"></path></svg>
                    </a>
                </div>
            </div>
        </header>

        <section id="public-business-profile" class="public-business-profile" aria-label="About this business" hidden></section>
        <main class="catalogue-layout">
            <nav class="catalogue-menu" aria-label="Booking steps" hidden>
                <button type="button" data-step="sessions" aria-controls="service-catalogue" aria-pressed="true" aria-current="step"><span class="step-number" aria-hidden="true">1</span><span class="step-label">Choose a session</span><span class="step-indicator" aria-hidden="true">Current step</span></button>
                <button type="button" data-step="schedule" aria-controls="client-calendar" aria-pressed="false"><span class="step-number" aria-hidden="true">2</span><span class="step-label">Choose date &amp; Time</span><span class="step-indicator" aria-hidden="true">Current step</span></button>
                <button type="button" data-step="checkout" aria-controls="client-checkout" aria-pressed="false"><span class="step-number" aria-hidden="true">3</span><span class="step-label">Checkout</span><span class="step-indicator" aria-hidden="true">Current step</span></button>
            </nav>
            <nav id="category-navigation" class="catalogue-categories" aria-label="Service categories" hidden>
                <div id="category-buttons" class="category-buttons"></div>
            </nav>
            <div class="catalogue-main">
            <div class="catalogue-content">
            <section id="service-catalogue" class="client-catalogue" aria-label="Services" tabindex="-1" hidden>
                <h2 id="active-category-heading" class="active-category-heading" aria-live="polite" aria-atomic="true" hidden></h2>
                <div id="client-services" class="client-service-list"></div>
            </section>
            <section id="client-checkout" aria-labelledby="checkout-heading" hidden>
                <h2 id="checkout-heading" class="client-section-heading" tabindex="-1">Checkout</h2>
                
            </section>
            </div>
            </div>
            <aside id="booking-summary" class="booking-summary" aria-labelledby="booking-summary-heading" hidden>
                <h2 id="booking-summary-heading">Your booking</h2>
                <div class="booking-summary-content" aria-live="polite" aria-atomic="true">
                    <p id="booking-summary-empty" class="muted-text">Choose a service</p>
                    <div id="booking-summary-service" hidden>
                        <img id="booking-summary-photo" class="booking-summary-photo" alt="" width="72" height="72" hidden>
                        <h3 id="booking-summary-name"></h3>
                        <p id="booking-summary-details" class="muted-text"></p>
                        <p id="booking-summary-price" class="booking-summary-price"></p>
                    </div>
                </div>
            <section id="client-calendar" aria-labelledby="calendar-heading" hidden>
                <h2 id="calendar-heading" class="client-section-heading" tabindex="-1">Choose date &amp; Time</h2>
                <div id="calendar-service" class="catalogue-selection" hidden>
                    <strong id="calendar-service-name"></strong>
                    <p id="calendar-service-details" class="muted-text"></p>
                    
                </div>
            <div class="month-header">
                <h3>Select a date</h3>
                <div class="month-navigation">
                    <span id="calendar-month" aria-live="polite"></span>
                    <button id="previous-month" type="button" aria-label="Previous month" disabled>&lsaquo;</button>
                    <button id="next-month" type="button" aria-label="Next month" disabled>&rsaquo;</button>
                </div>
            </div>
            <div class="month-weekdays" aria-hidden="true">
                <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
            </div>
            <div class="month-days" id="day-tabs" role="group" aria-labelledby="calendar-month"></div>
            <p class="calendar-legend muted-text">A dot marks dates with available times.</p>
            <div class="available-times-heading">
                <h3>Available times</h3>
                <span id="selected-calendar-date" class="muted-text"></span>
            </div>

            <!-- Time slot chips will be injected here by JavaScript -->
            <div class="time-chip-grid" id="time-grid">
                <div class="skeleton-chip"></div>
                <div class="skeleton-chip"></div>
                <div class="skeleton-chip"></div>
                <div class="skeleton-chip"></div>
                <div class="skeleton-chip"></div>
                <div class="skeleton-chip"></div>
            </div>
            </section>
            <button id="book-selected-slot" class="booking-button calendar-book-button" type="button" disabled>Continue to checkout</button>
            </aside>
        </main>

        <footer style="margin-top: auto; text-align: center;">
            <!-- Logtraq Viral Footer -->
            <div style="margin-top: 24px; font-size: 12px; color: #94A3B8; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 500;">
                <div style="display: flex; align-items: center; gap: 6px;">
                    <img src="/final_tax_logo.png" alt="Logtraq" style="width: 14px; height: 14px; object-fit: contain;">
                    <span>© 2026 Logtraq</span>
                </div>
                <span style="opacity: 0.4;">|</span>
                <a href="mailto:info@logtraq.co.za" style="text-decoration: none; font-size: 14px; opacity: 0.8; transition: opacity 0.2s;" title="Email Logtraq">✉️</a>
                <a href="tel:+27793257256" style="text-decoration: none; font-size: 14px; opacity: 0.8; transition: opacity 0.2s;" title="Call Logtraq">📞</a>
            </div>
        </footer>
    </div>

    <!-- Load the configuration keys -->
    <script src="/config.js"></script>
    <!-- Load the logic -->
    <script src="/business-profile.js?v=3"></script>
    <script src="/app.js?v=9"></script>
</body>
</html>
